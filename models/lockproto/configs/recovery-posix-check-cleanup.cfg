\* recovery scenario, POSIX, strong identity, strong lock capability: the Recoverer/Cleanup pairing of
\* the check suite (design Section 12). Both actors move a dead owner's lock aside through 240.3, so
\* this is where two movers of different kinds meet. Measured: 1,604,109 distinct states, exhausts.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1}
    Recoverers = {r1}
    PlainRuns = {}
    Cleanups = {c1}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 5
    MaxCrashes = 2
    HostCrashes = FALSE
    Platform = "posix"
    IdentityStrength = "strong"
    LockCapability = "strong"
    FIX_OWNER_HOLDS_OSLOCK = FALSE
    defaultInitValue = defaultInitValue
INVARIANTS
    FsOk
    Classifiable
    SingleWriter
    PlainNeverOwnsUncertain
    ForeignUntouched
    RefusalJustified
