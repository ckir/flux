\* breaklock-remote scenario, POSIX, LockCapability = remote: an Owner, two Breakers and a PlainRun, one crash and one lease expiry, no symmetry
\* (design Section 12, plan 3: measured with all four actors first; paired only if it does not fit). Not yet measured.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1}
    Recoverers = {}
    PlainRuns = {p1}
    Cleanups = {}
    Breakers = {b1, b2}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 5
    MaxCrashes = 1
    HostCrashes = FALSE
    MaxLeaseExpiries = 1
    Platform = "posix"
    IdentityStrength = "strong"
    LockCapability = "remote"
    SEED_RECOVER_FOREIGN = FALSE
    SEED_RECOVER_UNCERTAIN = FALSE
    SEED_DEAD_AS_BUSY = FALSE
    SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = FALSE
    SEED_ACQUIRER_UNLINKS_BY_NAME = FALSE
    SEED_RESTART_RELEASES = FALSE
    SEED_MOVE_ASIDE_FOR_UNCERTAIN = FALSE
    SEED_RENAME_OVER_TAKEOVER = FALSE
    SEED_NO_CAPABILITY_GATE = FALSE
    SEED_TORN_AS_FOREIGN = FALSE
    defaultInitValue = defaultInitValue
INVARIANTS
    FsOk
    Classifiable
    SingleWriter
    PlainNeverOwnsUncertain
    ForeignUntouched
    RefusalJustified
