[package]
name = "flux-platform"
description = "Linux, macOS and Windows implementations of the Flux filesystem abstractions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
flux-fs = { path = "../flux-fs" }

# The filesystem probes of the lock-protocol model (tests/fs_semantics.rs,
# lock-model design Section 10).
[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true }
