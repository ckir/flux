\* breaklock scenario, POSIX, LockCapability = weak, the capability gate NOT bypassed, and exactly ONE
\* actor: a recoverer (240.3). Each of the five 235.1 refusal sites belongs to a different process kind, and a
\* witness halts at the FIRST violating state - so one run per kind is the only way each site is really
\* reached. This one is `rec_start` (capstone round 5: the round-4 witness reached one site of five).
SPECIFICATION Spec
CONSTANTS
    Owners = {}
    Recoverers = {r1}
    PlainRuns = {}
    Cleanups = {}
    Breakers = {}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 3
    MaxCrashes = 2
    HostCrashes = FALSE
    MaxLeaseExpiries = 0
    Platform = "posix"
    IdentityStrength = "strong"
    LockCapability = "weak"
    SEED_RECOVER_FOREIGN = FALSE
    SEED_RECOVER_UNCERTAIN = FALSE
    SEED_DEAD_AS_BUSY = FALSE
    SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = FALSE
    SEED_ACQUIRER_UNLINKS_BY_NAME = FALSE
    SEED_RESTART_RELEASES = FALSE
    SEED_MOVE_ASIDE_FOR_UNCERTAIN = FALSE
    SEED_RENAME_OVER_TAKEOVER = FALSE
    SEED_NO_CAPABILITY_GATE = FALSE
    SEED_TORN_AS_FOREIGN = FALSE
    FIX_REMOTE_LEASE_SPEC = FALSE
    defaultInitValue = defaultInitValue
INVARIANT
    NeverRefusedUnsafe
