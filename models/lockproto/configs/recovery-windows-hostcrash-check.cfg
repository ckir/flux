\* recovery scenario, WINDOWS, host crashes on: the host-crash tier's run of two recoverers racing for the same dead lock
\* (design Section 12). Actors and bounds as recovery-windows-check.cfg, with HostCrashes = TRUE.
SPECIFICATION Spec
SYMMETRY RecovererPerms
CONSTANTS
    Owners = {o1}
    Recoverers = {r1, r2}
    PlainRuns = {}
    Cleanups = {}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 3
    MaxCrashes = 2
    HostCrashes = TRUE
    Platform = "windows"
    IdentityStrength = "strong"
    LockCapability = "strong"
    defaultInitValue = defaultInitValue
INVARIANTS
    FsOk
    Classifiable
    SingleWriter
    PlainNeverOwnsUncertain
    ForeignUntouched
    RefusalJustified
