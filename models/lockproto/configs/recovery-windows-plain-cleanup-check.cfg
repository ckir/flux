\* recovery scenario, WINDOWS, strong identity, strong lock capability: the PlainRun/Cleanup pairing
\* of the check suite (design Section 12). It runs no Recoverer, because the three labels of the plain
\* rerun's own 240.3 path (`plain_recover`, `plain_recovered`, `plain_recovered_done`) need a dead
\* CLEANUP lock, which only a Cleanup that created one and then crashed can leave: they are covered by
\* no other run of the suite.
\* Measured: 1,471,158 distinct states, exhausts. MaxObjs verified non-binding
\* before the acquirer rule, which only removes files and so cannot make it bind.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1}
    Recoverers = {}
    PlainRuns = {p1}
    Cleanups = {c1}
    Breakers = {}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 6
    MaxCrashes = 2
    HostCrashes = FALSE
    MaxLeaseExpiries = 0
    Platform = "windows"
    IdentityStrength = "strong"
    LockCapability = "strong"
    SEED_RECOVER_FOREIGN = FALSE
    SEED_RECOVER_UNCERTAIN = FALSE
    SEED_DEAD_AS_BUSY = FALSE
    SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = FALSE
    SEED_ACQUIRER_UNLINKS_BY_NAME = FALSE
    SEED_RESTART_RELEASES = FALSE
    SEED_MOVE_ASIDE_FOR_UNCERTAIN = FALSE
    SEED_RENAME_OVER_TAKEOVER = FALSE
    SEED_NO_CAPABILITY_GATE = FALSE
    SEED_TORN_AS_FOREIGN = FALSE
    FIX_REMOTE_LEASE_SPEC = FALSE
    FIX_TAKEOVER_REFUSAL = FALSE
    defaultInitValue = defaultInitValue
INVARIANTS
    FsOk
    Classifiable
    SingleWriter
    PlainNeverOwnsUncertain
    ForeignUntouched
    RefusalJustified
