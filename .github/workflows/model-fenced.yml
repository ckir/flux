name: Model (fenced prototype)

# The fenced-publication prototype (models/lockproto/Fenced.tla, expected-fenced.toml): a variant protocol
# measured against the one in the spec, on the branch model/fenced-prototype. Manual only - it is not a gate,
# it reports no checks, and it never runs on a pull request or on main.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fenced:
    name: Fenced prototype (posix)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run the prototype's model check
        run: python models/lockproto/run.py --expected models/lockproto/expected-fenced.toml --scenario fenced --platform posix
      - name: Upload TLC output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tlc-output-fenced-posix
          path: target/tla/out/
