\* recovery scenario, POSIX: witness run for NeverDeadLockWithPendingMover (design Sections 4 and 12). The
\* actors and bounds are those of recovery-posix-check.cfg; the one invariant is expected to be
\* VIOLATED, which shows that a dead owner's lock with a mover still to start is reachable, so the liveness property's antecedent is not vacuous.
SPECIFICATION Spec
SYMMETRY RecovererPerms
CONSTANTS
    Owners = {o1}
    Recoverers = {r1, r2}
    PlainRuns = {}
    Cleanups = {}
    Breakers = {}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 3
    MaxCrashes = 2
    HostCrashes = FALSE
    MaxLeaseExpiries = 0
    Platform = "posix"
    IdentityStrength = "strong"
    LockCapability = "strong"
    SEED_RECOVER_FOREIGN = FALSE
    SEED_RECOVER_UNCERTAIN = FALSE
    SEED_DEAD_AS_BUSY = FALSE
    SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = FALSE
    SEED_ACQUIRER_UNLINKS_BY_NAME = FALSE
    defaultInitValue = defaultInitValue
INVARIANT
    NeverDeadLockWithPendingMover
