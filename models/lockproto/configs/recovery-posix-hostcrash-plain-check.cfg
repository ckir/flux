\* recovery scenario, POSIX, host crashes on: the host-crash tier's run of a plain rerun meeting a lock a recoverer is working on
\* (design Section 12). Actors and bounds as recovery-posix-plain-check.cfg, with HostCrashes = TRUE.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1}
    Recoverers = {r1}
    PlainRuns = {p1}
    Cleanups = {}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 4
    MaxCrashes = 2
    HostCrashes = TRUE
    Platform = "posix"
    IdentityStrength = "strong"
    LockCapability = "strong"
    defaultInitValue = defaultInitValue
INVARIANTS
    FsOk
    Classifiable
    SingleWriter
    PlainNeverOwnsUncertain
    ForeignUntouched
    RefusalJustified
