\* recovery scenario, WINDOWS, strong identity, strong lock capability: the Recoverer/Recoverer
\* pairing of the check suite, and its main Windows run (design Section 12). Two Recoverers race to
\* move the same dead owner's lock aside, which is what 240.3 step 2 is about; SYMMETRY over them is
\* sound here because no run of the suite checks a temporal property.
\* Measured: 1,380,999 distinct states, exhausts. MaxObjs verified non-binding
\* before the acquirer rule, which only removes files and so cannot make it bind.
SPECIFICATION Spec
SYMMETRY RecovererPerms
CONSTANTS
    Owners = {o1}
    Recoverers = {r1, r2}
    PlainRuns = {}
    Cleanups = {}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 3
    MaxCrashes = 2
    HostCrashes = FALSE
    Platform = "windows"
    IdentityStrength = "strong"
    LockCapability = "strong"
    SEED_RECOVER_FOREIGN = FALSE
    SEED_RECOVER_UNCERTAIN = FALSE
    SEED_DEAD_AS_BUSY = FALSE
    SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = FALSE
    defaultInitValue = defaultInitValue
INVARIANTS
    FsOk
    Classifiable
    SingleWriter
    PlainNeverOwnsUncertain
    ForeignUntouched
    RefusalJustified
