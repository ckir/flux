\* recovery scenario, POSIX, strong identity, strong lock capability: the PlainRun/Cleanup pairing of
\* the check suite (design Section 12). It runs no Recoverer, because the three labels of the plain
\* rerun's own 240.3 path (`plain_recover`, `plain_recovered`, `plain_recovered_done`) need a dead
\* CLEANUP lock, which only a Cleanup that created one and then crashed can leave: they are covered
\* by no other run of the suite. Measured: 1,067,868 distinct states, exhausts.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1}
    Recoverers = {}
    PlainRuns = {p1}
    Cleanups = {c1}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 6
    MaxCrashes = 2
    HostCrashes = FALSE
    Platform = "posix"
    IdentityStrength = "strong"
    LockCapability = "strong"
    SEED_RECOVER_FOREIGN = FALSE
    SEED_RECOVER_UNCERTAIN = FALSE
    SEED_DEAD_AS_BUSY = FALSE
    SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = FALSE
    defaultInitValue = defaultInitValue
INVARIANTS
    FsOk
    Classifiable
    SingleWriter
    PlainNeverOwnsUncertain
    ForeignUntouched
    RefusalJustified
