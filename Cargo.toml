# Flux workspace root.
#
# The root is also a package, but it carries NO lib and NO bin — it exists only
# to own the workspace-level `tests/` and `benches/` targets that spec §3 puts at
# the top level. The shipped binary is `flux`, produced by crates/flux-cli.

[package]
name = "flux"
version.workspace = true
edition = "2024"
rust-version = "1.85"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[[bench]]
name = "copy"
path = "benches/copy.rs"
harness = false

[dev-dependencies]
blake3 = { workspace = true }
criterion = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[workspace]
resolver = "3"
members = [
    "crates/flux-core",
    "crates/flux-fs",
    "crates/flux-platform",
    "crates/flux-hash",
    "crates/flux-ui",
    "crates/flux-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/ckir/flux"
publish = false

# Shared version registry. Spec §67 calls these "candidate crates" and requires a
# final selection pass on performance / correctness / portability / maintenance /
# licensing / API stability. Listing a crate here pins ONE version for the whole
# workspace; it does NOT add it to any crate — member crates opt in individually
# with `foo = { workspace = true }`. Nothing here is a commitment yet.
[workspace.dependencies]
# --- spec §67 candidates ---
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"
crossbeam-channel = "0.5"
blake3 = "1.8"
indicatif = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# models/lockproto/trace.toml parsing in tests/model_stamp.rs (lock-model design Section 9)
toml = "1.1"
# crates/flux-platform/tests/fs_semantics.rs probes (lock-model design Section 10)
rustix = { version = "1.1", features = ["fs"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
walkdir = "2.5"
# jwalk is in the spec §67 candidate list but crates.io currently ships it with the
# description "Use `dua-core` instead" and it has not moved since 0.9.0 — treat it as
# unmaintained and decide against walkdir/custom before adopting. Deliberately unpinned.

# --- internal crates ---
flux-core = { path = "crates/flux-core" }
flux-fs = { path = "crates/flux-fs" }
flux-platform = { path = "crates/flux-platform" }
flux-hash = { path = "crates/flux-hash" }
flux-ui = { path = "crates/flux-ui" }

# --- test / bench tooling (spec §3 benches/, §68 testing strategy) ---
criterion = "0.8"
proptest = "1.11"
tempfile = "3"

[profile.ci]
inherits = "dev"
debug = 0
strip = "debuginfo"

# The shipped binary. `panic = "abort"` means a panic is a hard crash with no unwinding, so no Drop
# runs and a held lock file is left behind rather than released - which is the dead-owner case the
# lock protocol already models and recovers (240.2, 240.3), not a new failure mode. `strip = true`
# removes the symbols, so a field panic gives no backtrace; the debug build keeps them.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
