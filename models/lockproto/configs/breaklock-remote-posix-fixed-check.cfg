\* breaklock-remote scenario, POSIX, LockCapability = remote: an Owner and two Breakers, one crash and one lease expiry, no symmetry
\* (design Section 12, plan 3: the four-actor config did not finish in 72 min at ~65M states, so it is paired). Measured: CI Model run 35115798970.
\* The same run with FIX_REMOTE_LEASE_SPEC on. It must violate nothing - but that result is NARROWER
\* than it looks, and it used to be written here as though it were not. The flag REPLACES `Superseded`
\* with `checkStale[p]`, and every acquisition and every takeover stales every OTHER process, so under
\* the flag a second counted writer is close to structurally unreachable. A clean pass therefore shows
\* the amendment is self-consistent; it does NOT show the accepted window is the only way SingleWriter
\* breaks (design Section 11). The sibling -witness-NoLiveWriter run rules out the weaker failure, that
\* the count is identically zero. Telling "the window closed" from "the other writer was defined away"
\* needs SingleWriter checked against the UNFIXED `Superseded` inside this configuration - deferred with
\* the breaklock-remote job split (capstone, plan 3).
SPECIFICATION Spec
CONSTANTS
    Owners = {o1}
    Recoverers = {}
    PlainRuns = {}
    Cleanups = {}
    Breakers = {b1, b2}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 5
    MaxCrashes = 1
    HostCrashes = FALSE
    MaxLeaseExpiries = 1
    Platform = "posix"
    IdentityStrength = "strong"
    LockCapability = "remote"
    SEED_RECOVER_FOREIGN = FALSE
    SEED_RECOVER_UNCERTAIN = FALSE
    SEED_DEAD_AS_BUSY = FALSE
    SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = FALSE
    SEED_ACQUIRER_UNLINKS_BY_NAME = FALSE
    SEED_RESTART_RELEASES = FALSE
    SEED_MOVE_ASIDE_FOR_UNCERTAIN = FALSE
    SEED_RENAME_OVER_TAKEOVER = FALSE
    SEED_NO_CAPABILITY_GATE = FALSE
    SEED_TORN_AS_FOREIGN = FALSE
    SEED_FS_LOCK_WITHOUT_HANDLE = FALSE
    SEED_FS_ALIEN_CONTENT = FALSE
    SEED_CHECK_REFUSES_UNTOUCHED = FALSE
    FIX_REMOTE_LEASE_SPEC = TRUE
    defaultInitValue = defaultInitValue
