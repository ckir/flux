# Exact-text mutants of the lock-protocol model (cut 6, revision 3). Each `[[mutant]]` entry names a
# source file, the exact CURRENT text it edits (`old`, which must occur exactly once in that file), the
# mutated text (`new`), the one config the mutant is targeted against, and what a killed mutant's TLC
# run must report: `expect_present` for a check config (the mutation must make it VIOLATE that
# invariant or property), or `expect_absent` for a seeded or witness config (the mutation must make it
# STOP reporting the name its seed or witness exists to show). `python run.py --mutants mutants.toml`
# applies each mutant to a scratch copy of the model - the repository itself is never touched - runs
# TLC on its config, and judges the outcome; `--list-mutants` validates the manifest and its `old` text
# against the CURRENT sources without running TLC. The GitHub workflow `model-mutants.yml` runs every
# entry here, one per CI job, on a push that touches this file, `run.py`, or the workflow itself, or on
# `workflow_dispatch`. A tooling failure (a parse error, a TLC error, a timeout) is never a kill.

