# Runs of the lock-protocol model check and what each must report.
# Format: design Section 4 (docs/superpowers/specs/2026-09-11-lock-protocol-model-check-design.md).
# `scenarios` is the only place scenario names are defined; CI builds its matrix from it.

scenarios = ["selftest", "recovery", "breaklock", "mixed", "breaklock-remote", "mixed-remote"]

# Labels no BUILT scenario covers but a planned one will (design Section 4). Each entry goes when its
# scenario lands: the stamp test requires the scenario to be in trace.toml's planned_scenarios.
deferred = [
    { label = "S96_1_backoff", scenario = "dirlock", reason = "the 96.1 directory-lock conflict needs the directory lock only dirlock creates" },
]

# Runner self-test (Smoke.tla): exercises every way run.py judges a run. Not a protocol scenario.

[[run]]
name = "selftest-posix-check"
module = "Smoke"
config = "configs/selftest-check.cfg"
scenario = "selftest"
kind = "check"
open_findings = [
    { name = "AtMostThree", tracking = "selftest: exercises the open-finding and fix-flag path", fix_flag = "FIX_BOUND" },
]
unreached = [
    { label = "Overshoot", reason = "SEED_OVERSHOOT is off in this run; the seeded run reaches it" },
]
constants = { SEED_OVERSHOOT = false }
timeout_minutes = 2

[[run]]
name = "selftest-posix-liveness"
module = "Smoke"
config = "configs/selftest-liveness.cfg"
scenario = "selftest"
kind = "liveness"
unreached = [
    { label = "Overshoot", reason = "SEED_OVERSHOOT is off in this run; the seeded run reaches it" },
]
constants = { SEED_OVERSHOOT = false }
timeout_minutes = 2

[[run]]
name = "selftest-posix-witness-NeverReachedTwo"
module = "Smoke"
config = "configs/selftest-witness-NeverReachedTwo.cfg"
scenario = "selftest"
kind = "witness"
violated = ["NeverReachedTwo"]
constants = { SEED_OVERSHOOT = false }
timeout_minutes = 2

[[run]]
name = "selftest-posix-seeded-SEED_OVERSHOOT"
module = "Smoke"
config = "configs/selftest-seeded-SEED_OVERSHOOT.cfg"
scenario = "selftest"
kind = "seeded"
violated = ["WithinBound"]
constants = { SEED_OVERSHOOT = true }
timeout_minutes = 2

# Recovery scenario (design Section 12): four actor pairings per platform, never all at once, each
# exhaustive; then the witnesses on each platform's main pairing, and the POSIX seeded runs that show each
# safety invariant can fail (design Section 8). timeout_minutes is provisional until the controlled timing measurement.

[[run]]
name = "recovery-posix-check"
module = "LockProtocol"
config = "configs/recovery-posix-check.cfg"
scenario = "recovery"
kind = "check"
constants = { Owners = ["o1"], Recoverers = ["r1", "r2"], PlainRuns = [], Cleanups = [], Breakers = [], MaxObjs = 3, MaxCrashes = 2, HostCrashes = false, MaxLeaseExpiries = 0, Platform = "posix", IdentityStrength = "strong", LockCapability = "strong", SEED_RECOVER_FOREIGN = false, SEED_RECOVER_UNCERTAIN = false, SEED_DEAD_AS_BUSY = false, SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = false, SEED_ACQUIRER_UNLINKS_BY_NAME = false, SEED_RESTART_RELEASES = false, SEED_MOVE_ASIDE_FOR_UNCERTAIN = false, SEED_RENAME_OVER_TAKEOVER = false, SEED_NO_CAPABILITY_GATE = false, SEED_TORN_AS_FOREIGN = false }
symmetry = { definition = "RecovererPerms", over = "Recoverers" }
unreached = [
    { label = "S96_1_backoff", reason = "the 96.1 directory-lock conflict: this scenario has no directory lock; dirlock reaches it" },
    { label = "S240_3_putback", reason = "240.3 step 3 finds a different file only after a 240.5 in-place takeover rewrote the record under a running Recoverer, which needs a lapsed lease; mixed-remote reaches it" },
    { label = "S99_refuse_close", reason = "a Section 99 check fails only for an owner whose lock was taken while it ran; no recovery actor loses its lock while running (a takeover needs a Breaker, a lapsed lease needs LockCapability = remote)" },
]
timeout_minutes = 30

