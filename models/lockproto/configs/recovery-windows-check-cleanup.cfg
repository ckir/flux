\* recovery scenario, WINDOWS, strong identity, strong lock capability: the Recoverer/Cleanup pairing
\* of the check suite (design Section 12). Both actors move a dead owner's lock aside through 240.3,
\* so this is where two movers of different kinds meet.
\* Measured: 2,171,790 distinct states, exhausts. MaxObjs verified non-binding.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1}
    Recoverers = {r1}
    PlainRuns = {}
    Cleanups = {c1}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 5
    MaxCrashes = 2
    HostCrashes = FALSE
    Platform = "windows"
    IdentityStrength = "strong"
    LockCapability = "strong"
    defaultInitValue = defaultInitValue
INVARIANTS
    FsOk
    Classifiable
    SingleWriter
    PlainNeverOwnsUncertain
    ForeignUntouched
    RefusalJustified
