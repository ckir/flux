name: Release

on:
  push:
    tags: ["v*"]
  # Manual re-run, for when a tag's assets are missing or a runner died after the
  # release was already created. v0.1.0 shipped with zero binaries and had to be
  # recovered as a fresh tag; with this, the same failure is a re-run instead.
  #
  # The tag is REQUIRED and is not defaulted: a manual run from a branch has no
  # release to upload to, so the input is what gives the job a target at all.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload assets for, e.g. v0.1.1"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - runner: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      # On a manual run, build the TAG that was asked for, not the branch the
      # workflow was dispatched from.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --package flux-cli --bin flux

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          tar -czf "flux-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" flux

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/flux.exe" -DestinationPath "flux-${{ matrix.target }}.zip"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          # `inputs.tag` is empty on a tag push, so this falls back to the pushed tag.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: flux-${{ matrix.target }}.*
