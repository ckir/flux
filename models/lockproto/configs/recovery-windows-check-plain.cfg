\* recovery scenario, WINDOWS, strong identity, strong lock capability: the Recoverer/PlainRun
\* pairing of the check suite (design Section 12), where a plain rerun (21.1) meets a dead owner's
\* lock a recoverer is working on.
\* Measured: 2,310,021 distinct states, exhausts - the largest run of the suite. MaxObjs verified non-binding
\* before the acquirer rule, which only removes files and so cannot make it bind.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1}
    Recoverers = {r1}
    PlainRuns = {p1}
    Cleanups = {}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 4
    MaxCrashes = 2
    HostCrashes = FALSE
    Platform = "windows"
    IdentityStrength = "strong"
    LockCapability = "strong"
    defaultInitValue = defaultInitValue
INVARIANTS
    FsOk
    Classifiable
    SingleWriter
    PlainNeverOwnsUncertain
    ForeignUntouched
    RefusalJustified
