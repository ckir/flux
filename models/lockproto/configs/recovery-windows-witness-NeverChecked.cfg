\* recovery scenario, Windows: witness run for NeverChecked (design Sections 4, 7 and 12). The actors and
\* bounds are those of recovery-windows-check.cfg; the one invariant is expected to be VIOLATED, which shows
\* that a process passes its Section 99 check, so SingleWriter's ghost is set.
SPECIFICATION Spec
SYMMETRY RecovererPerms
CONSTANTS
    Owners = {o1}
    Recoverers = {r1, r2}
    PlainRuns = {}
    Cleanups = {}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 3
    MaxCrashes = 2
    HostCrashes = FALSE
    Platform = "windows"
    IdentityStrength = "strong"
    LockCapability = "strong"
    SEED_RECOVER_FOREIGN = FALSE
    SEED_RECOVER_UNCERTAIN = FALSE
    SEED_DEAD_AS_BUSY = FALSE
    SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = FALSE
    defaultInitValue = defaultInitValue
INVARIANT
    NeverChecked
