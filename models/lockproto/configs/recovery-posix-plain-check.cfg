\* recovery scenario, POSIX, strong identity, strong lock capability: the Recoverer/PlainRun pairing
\* of the check suite (design Section 12). All four actors at once do not exhaust in the budget, so
\* the scenario's check runs pair them instead; this one is where a plain rerun (21.1) meets a dead
\* owner's lock a Recoverer is working on. Measured: 1,645,500 distinct states, exhausts.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1}
    Recoverers = {r1}
    PlainRuns = {p1}
    Cleanups = {}
    Breakers = {}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 4
    MaxCrashes = 2
    HostCrashes = FALSE
    MaxLeaseExpiries = 0
    Platform = "posix"
    IdentityStrength = "strong"
    LockCapability = "strong"
    SEED_RECOVER_FOREIGN = FALSE
    SEED_RECOVER_UNCERTAIN = FALSE
    SEED_DEAD_AS_BUSY = FALSE
    SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = FALSE
    SEED_ACQUIRER_UNLINKS_BY_NAME = FALSE
    SEED_RESTART_RELEASES = FALSE
    SEED_MOVE_ASIDE_FOR_UNCERTAIN = FALSE
    SEED_RENAME_OVER_TAKEOVER = FALSE
    SEED_NO_CAPABILITY_GATE = FALSE
    SEED_TORN_AS_FOREIGN = FALSE
    FIX_REMOTE_LEASE_SPEC = FALSE
    defaultInitValue = defaultInitValue
INVARIANTS
    FsOk
    Classifiable
    SingleWriter
    PlainNeverOwnsUncertain
    ForeignUntouched
    RefusalJustified
