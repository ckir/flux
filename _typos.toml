# https://github.com/crate-ci/typos

[files]
extend-exclude = [
    "target/",
    "Cargo.lock",
    # The engineering spec is a delivered document; do not rewrite it. Matched by
    # pattern, not by name, so a new spec version is excluded the day it lands
    # instead of being scanned for the first time by CI.
    "FLUX_FULL_UPDATED_SPEC_V*.md",
]

[default]
extend-ignore-re = [
    # BLAKE3 / SHA-256 style hex digests
    "[0-9a-fA-F]{32,}",
    "blake3:[0-9a-f]+",
    # The PlusCal translator's checksums in a generated TLA+ module
    "chksum\\((pcal|tla)\\) = \"[0-9a-f]+\"",
]

[default.extend-words]
# POSIX open(2) flag names, as rustix and libc spell them. WRONLY in particular
# is read as a misspelling of WRONGLY, which would make the handle-relative
# writer (§149.7) unbuildable without this line.
WRONLY = "WRONLY"
RDONLY = "RDONLY"
RDWR = "RDWR"
NOFOLLOW = "NOFOLLOW"
# Domain terms that look like typos
reflink = "reflink"
reflinks = "reflinks"
hardlink = "hardlink"
hardlinks = "hardlinks"
inode = "inode"
inodes = "inodes"
ser = "ser"
der = "der"
flux = "flux"
ckir = "ckir"
