\* recovery scenario, WINDOWS, host crashes on: the host-crash tier's run of a plain rerun meeting a lock a recoverer is working on
\* (design Section 12). Actors and bounds as recovery-windows-plain-check.cfg, with HostCrashes = TRUE.
SPECIFICATION Spec
