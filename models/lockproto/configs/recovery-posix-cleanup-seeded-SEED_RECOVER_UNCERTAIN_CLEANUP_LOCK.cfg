\* recovery scenario, POSIX: seeded run for SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK (design Section 8): a Recoverer moves
\* aside a cleanup lock whose owner it could not judge dead. The actors and bounds are those of
\* recovery-posix-cleanup-check.cfg; the run must stop with PlainNeverOwnsUncertain violated, which only the
\* ownerLive half of JudgedUncertain can report. It lists every safety invariant of the scenario.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1}
    Recoverers = {r1}
    PlainRuns = {}
    Cleanups = {c1}
    Breakers = {}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 5
    MaxCrashes = 2
    HostCrashes = FALSE
    MaxLeaseExpiries = 0
    Platform = "posix"
    IdentityStrength = "strong"
    LockCapability = "strong"
    SEED_RECOVER_FOREIGN = FALSE
    SEED_RECOVER_UNCERTAIN = FALSE
    SEED_DEAD_AS_BUSY = FALSE
    SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = TRUE
    SEED_ACQUIRER_UNLINKS_BY_NAME = FALSE
    SEED_RESTART_RELEASES = FALSE
    SEED_MOVE_ASIDE_FOR_UNCERTAIN = FALSE
    SEED_RENAME_OVER_TAKEOVER = FALSE
    SEED_NO_CAPABILITY_GATE = FALSE
    SEED_TORN_AS_FOREIGN = FALSE
    defaultInitValue = defaultInitValue
INVARIANTS
    FsOk
    Classifiable
    SingleWriter
    PlainNeverOwnsUncertain
    ForeignUntouched
    RefusalJustified
