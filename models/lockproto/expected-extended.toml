# The slower host-crash tier of the lock-protocol model check (design Sections 4 and 12). Same schema
# as expected.toml. It runs on a schedule and on request, never as part of `just model` or the
# per-pull-request jobs:
#   python models/lockproto/run.py --expected models/lockproto/expected-extended.toml --scenario recovery
# The suite-wide union is not judged here. That held originally because host crashes share `env_loop`
# and so cover no label the process-crash runs in expected.toml miss; it also holds for the
# breaklock liveness run moved here on 2026-09-22, which was measured to cover 70 labels and zero of
# them uniquely.
#
# It is also where an OPEN EXPERIMENT goes - a run whose outcome is not known yet, which therefore must
# not be able to redden the per-pull-request gate. The takeover-refusal witness lived here on 2026-09-17
# and answered its question in one run (CI 35188279927): exhaustive at 17,377,074 states, no violation.

scenarios = ["breaklock", "recovery"]

[[run]]
name = "recovery-posix-hostcrash-check"
module = "LockProtocol"
config = "configs/recovery-posix-hostcrash-check.cfg"
scenario = "recovery"
kind = "check"
constants = { Owners = ["o1"], Recoverers = ["r1", "r2"], PlainRuns = [], Cleanups = [], Breakers = [], MaxObjs = 3, MaxCrashes = 2, HostCrashes = true, MaxLeaseExpiries = 0, Platform = "posix", IdentityStrength = "strong", LockCapability = "strong", SEED_RECOVER_FOREIGN = false, SEED_RECOVER_UNCERTAIN = false, SEED_DEAD_AS_BUSY = false, SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = false, SEED_ACQUIRER_UNLINKS_BY_NAME = false, SEED_RESTART_RELEASES = false, SEED_MOVE_ASIDE_FOR_UNCERTAIN = false, SEED_RENAME_OVER_TAKEOVER = false, SEED_NO_CAPABILITY_GATE = false, SEED_TORN_AS_FOREIGN = false, SEED_FS_LOCK_WITHOUT_HANDLE = false, SEED_FS_ALIEN_CONTENT = false, SEED_CHECK_REFUSES_UNTOUCHED = false }
symmetry = { definition = "RecovererPerms", over = "Recoverers" }
unreached = [
    { label = "S96_1_backoff", reason = "the 96.1 directory-lock conflict: this scenario has no directory lock; dirlock reaches it" },
    { label = "S240_3_putback", reason = "240.3 step 3 finds a different file only after a 240.5 in-place takeover rewrote the record under a running Recoverer, which needs a lapsed lease; mixed-remote reaches it" },
    { label = "S99_refuse_close", reason = "a Section 99 check fails only for an owner whose lock was taken while it ran; no recovery actor loses its lock while running (a takeover needs a Breaker, a lapsed lease needs LockCapability = remote)" },
]
timeout_minutes = 1

