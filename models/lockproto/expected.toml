# Runs of the lock-protocol model check and what each must report.
# Format: design Section 4 (docs/superpowers/specs/2026-09-11-lock-protocol-model-check-design.md).
# `scenarios` is the only place scenario names are defined; CI builds its matrix from it.

scenarios = ["selftest", "recovery"]

# Labels no BUILT scenario covers but a planned one will (design Section 4). Each entry goes when its
# scenario lands: the stamp test requires the scenario to be in trace.toml's planned_scenarios.
deferred = [
    { label = "S96_1_backoff", scenario = "dirlock", reason = "the 96.1 directory-lock conflict needs the directory lock only dirlock creates" },
    { label = "S240_3_putback", scenario = "breaklock", reason = "240.3 step 3 finds a different file only after a 240.5 in-place takeover, which only breaklock performs" },
]

# Runner self-test (Smoke.tla): exercises every way run.py judges a run. Not a protocol scenario.

[[run]]
name = "selftest-posix-check"
module = "Smoke"
config = "configs/selftest-check.cfg"
scenario = "selftest"
kind = "check"
open_findings = [
    { name = "AtMostThree", tracking = "selftest: exercises the open-finding and fix-flag path", fix_flag = "FIX_BOUND" },
]
unreached = [
    { label = "Overshoot", reason = "SEED_OVERSHOOT is off in this run; the seeded run reaches it" },
]
constants = { SEED_OVERSHOOT = false }
timeout_minutes = 2

[[run]]
name = "selftest-posix-liveness"
module = "Smoke"
config = "configs/selftest-liveness.cfg"
scenario = "selftest"
kind = "liveness"
unreached = [
    { label = "Overshoot", reason = "SEED_OVERSHOOT is off in this run; the seeded run reaches it" },
]
constants = { SEED_OVERSHOOT = false }
timeout_minutes = 2

[[run]]
name = "selftest-posix-witness-NeverReachedTwo"
module = "Smoke"
config = "configs/selftest-witness-NeverReachedTwo.cfg"
scenario = "selftest"
kind = "witness"
violated = ["NeverReachedTwo"]
constants = { SEED_OVERSHOOT = false }
timeout_minutes = 2

[[run]]
name = "selftest-posix-seeded-SEED_OVERSHOOT"
module = "Smoke"
config = "configs/selftest-seeded-SEED_OVERSHOOT.cfg"
scenario = "selftest"
kind = "seeded"
violated = ["WithinBound"]
constants = { SEED_OVERSHOOT = true }
timeout_minutes = 2

# Recovery scenario (design Section 12): four actor pairings per platform, never all at once, each
# exhaustive; then the three witnesses on each platform's main pairing. timeout_minutes is provisional
# until the controlled timing measurement.

[[run]]
name = "recovery-posix-check"
module = "LockProtocol"
config = "configs/recovery-posix-check.cfg"
scenario = "recovery"
kind = "check"
constants = { Owners = ["o1"], Recoverers = ["r1", "r2"], PlainRuns = [], Cleanups = [], MaxObjs = 3, MaxCrashes = 2, HostCrashes = false, Platform = "posix", IdentityStrength = "strong", LockCapability = "strong" }
symmetry = { definition = "RecovererPerms", over = "Recoverers" }
unreached = [
    { label = "S96_1_backoff", reason = "the 96.1 directory-lock conflict: this scenario has no directory lock; dirlock reaches it" },
    { label = "S240_3_putback", reason = "240.3 step 3 finds a different file only after a 240.5 in-place takeover rewrote the record; breaklock reaches it" },
]
timeout_minutes = 30

[[run]]
name = "recovery-posix-plain-check"
module = "LockProtocol"
config = "configs/recovery-posix-plain-check.cfg"
scenario = "recovery"
kind = "check"
constants = { Owners = ["o1"], Recoverers = ["r1"], PlainRuns = ["p1"], Cleanups = [], MaxObjs = 4, MaxCrashes = 2, HostCrashes = false, Platform = "posix", IdentityStrength = "strong", LockCapability = "strong" }
unreached = [
    { label = "S96_1_backoff", reason = "the 96.1 directory-lock conflict: this scenario has no directory lock; dirlock reaches it" },
    { label = "S240_3_putback", reason = "240.3 step 3 finds a different file only after a 240.5 in-place takeover rewrote the record; breaklock reaches it" },
    { label = "plain_recover", reason = "reached only by a plain rerun that finds a dead CLEANUP lock, which needs a Cleanup actor; recovery-<platform>-plain-cleanup-check reaches it" },
    { label = "plain_recovered", reason = "reached only by a plain rerun that finds a dead CLEANUP lock, which needs a Cleanup actor; recovery-<platform>-plain-cleanup-check reaches it" },
    { label = "plain_recovered_done", reason = "reached only by a plain rerun that finds a dead CLEANUP lock, which needs a Cleanup actor; recovery-<platform>-plain-cleanup-check reaches it" },
]
timeout_minutes = 30

