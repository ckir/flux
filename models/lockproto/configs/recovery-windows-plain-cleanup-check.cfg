\* recovery scenario, WINDOWS, strong identity, strong lock capability: the PlainRun/Cleanup pairing
\* of the check suite (design Section 12). It runs no Recoverer, because the three labels of the plain
\* rerun's own 240.3 path (`plain_recover`, `plain_recovered`, `plain_recovered_done`) need a dead
\* CLEANUP lock, which only a Cleanup that created one and then crashed can leave: they are covered by
\* no other run of the suite.
\* Measured: 1,446,348 distinct states, exhausts. MaxObjs verified non-binding
\* before the acquirer rule, which only removes files and so cannot make it bind.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1}
    Recoverers = {}
    PlainRuns = {p1}
    Cleanups = {c1}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 6
    MaxCrashes = 2
    HostCrashes = FALSE
    Platform = "windows"
    IdentityStrength = "strong"
    LockCapability = "strong"
    defaultInitValue = defaultInitValue
INVARIANTS
    FsOk
    Classifiable
    SingleWriter
    PlainNeverOwnsUncertain
    ForeignUntouched
    RefusalJustified
