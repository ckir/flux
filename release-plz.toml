# release-plz (https://release-plz.dev), run by .github/workflows/release-plz.yml.
#
# Every push to main refreshes one release pull request: it bumps the shared workspace version, updates
# Cargo.lock and adds the next section of CHANGELOG.md. Merging that pull request is the release: release-plz
# then creates the `v{version}` tag and its GitHub release, and the tag starts .github/workflows/release.yml,
# which builds the binaries and attaches them.

[workspace]
# Nothing is published to crates.io (every crate has `publish = false`): the last released version is read
# from the `v{version}` git tags instead of the registry.
git_only = true
publish = false
# A binary with no published library API has nothing for cargo-semver-checks to compare against.
semver_check = false
# Every package generates a changelog, because `changelog_include` below MERGES the generated
# changelogs of the packages it lists -- a package that generates nothing contributes nothing. With
# this false, release-plz attributed every commit under crates/ to its own crate, those crates
# generated nothing, and the notes silently dropped them: 38 of the 41 feat/fix commits in this
# repository's history touch crates/, and NO release before v0.1.2 carried a Features or Bug fixes
# section at all.
changelog_update = true
# Release only when the release pull request is merged, not on every push to main.
release_always = false
# One tag and one GitHub release for the whole workspace, made by flux-cli below.
git_tag_enable = false
git_release_enable = false
pr_labels = ["release"]

# flux-cli ships the `flux` binary, but it does NOT carry the tag or the release, and an earlier
# revision of this file had it do both. release-plz takes a git release's BODY from the changelog of
# the package that CREATES that release, so splitting them -- release on flux-cli, aggregated changelog
# on the root package -- published an EMPTY release. MEASURED: v0.1.0 carried 1164 bytes of notes while
# the changelog still lived on flux-cli; v0.1.1 and v0.2.0 carried ZERO, the two releases after it moved.
[[package]]
name = "flux-cli"
version_group = "flux"

# The root package owns the changelog, because it is the only one release-plz attributes the whole
# repository to. MEASURED: with the changelog on flux-cli it carried ONE entry - `changelog_include`
# merges other packages' GENERATED changelogs, and `[workspace] changelog_update = false` meant the
# six included packages generated nothing. It keeps `v{{ version }}` so its links point at the tag
# flux-cli actually creates.
[[package]]
name = "flux"
version_group = "flux"
changelog_update = true
changelog_path = "CHANGELOG.md"
# The tag and the release live HERE, with the changelog they publish. One tag and one GitHub release
# for the whole workspace, as before -- only the package that makes them has moved.
git_tag_enable = true
git_release_enable = true
git_release_name = "v{{ version }}"
# The commits under crates/ belong to those crates, not to this one, so the single changelog has to
# pull them in explicitly. Listing all six is deliberate: a crate omitted here does not warn, it just
# stops appearing in the release notes, which is the failure being fixed.
changelog_include = ["flux-cli", "flux-core", "flux-fs", "flux-platform", "flux-hash", "flux-ui"]
git_tag_name = "v{{ version }}"

[[package]]
name = "flux-core"
version_group = "flux"

[[package]]
name = "flux-fs"
version_group = "flux"

[[package]]
name = "flux-platform"
version_group = "flux"

[[package]]
name = "flux-hash"
version_group = "flux"

[[package]]
name = "flux-ui"
version_group = "flux"

[changelog]
# Groups for the commit types this repository uses (CONTRIBUTING.md). A commit matching no parser lands in
# "Other" rather than vanishing.
commit_parsers = [
    { message = "^release", skip = true },
    { message = "^wip", skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    # Skipped: this changelog describes the SHIPPED BINARY, and these types do not change it. They are
    # the bulk of the repository - 130 spec, 43 design, 31 model, 11 docs, 8 skills, 8 plan, 5 test at
    # v0.1.0 - so without these skips the notes run to 240 entries and bury the few that ship.
    { message = "^(spec|design|plan)", skip = true },
    { message = "^(model|runner|trace|recovery)", skip = true },
    { message = "^(docs|skills)", skip = true },
    { message = "^tests?", skip = true },
    { message = "^(ci|build)", group = "Build and CI" },
    { message = "^(chore|style|revert)", group = "Miscellaneous" },
    { message = ".*", group = "Other" },
]
