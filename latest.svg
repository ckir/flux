<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
<rect width="720" height="540" fill="#ffffff"/>
<text x="12" y="20" fill="#111111" font-weight="bold" xml:space="preserve">Flux benchmark - Latest benchmark of main</text>
<text x="12" y="40" fill="#555555" font-weight="normal" xml:space="preserve">Flux time / comparator time. Below 1.0, Flux is faster.</text>
<text x="12" y="80" fill="#111111" font-weight="bold" xml:space="preserve">Linux - cold cache - 49fabc4 2026-10-09</text>
<text x="12" y="100" fill="#111111" font-weight="normal" xml:space="preserve">large  vs cp         1.00</text>
<text x="12" y="120" fill="#111111" font-weight="normal" xml:space="preserve">large  vs rsync      0.98</text>
<text x="12" y="140" fill="#111111" font-weight="normal" xml:space="preserve">mixed  vs cp         1.03</text>
<text x="12" y="160" fill="#111111" font-weight="normal" xml:space="preserve">mixed  vs rsync      0.96</text>
<text x="12" y="180" fill="#555555" font-weight="normal" xml:space="preserve">Not shown:</text>
<text x="12" y="200" fill="#555555" font-weight="normal" xml:space="preserve">  small vs cp: too noisy</text>
<text x="12" y="220" fill="#555555" font-weight="normal" xml:space="preserve">  small vs rsync: too noisy</text>
<text x="12" y="260" fill="#111111" font-weight="bold" xml:space="preserve">macOS - cold cache - 49fabc4 2026-10-09</text>
<text x="12" y="280" fill="#555555" font-weight="normal" xml:space="preserve">Not shown:</text>
<text x="12" y="300" fill="#555555" font-weight="normal" xml:space="preserve">  large vs cp: too noisy</text>
<text x="12" y="320" fill="#555555" font-weight="normal" xml:space="preserve">  large vs rsync: too noisy</text>
<text x="12" y="340" fill="#555555" font-weight="normal" xml:space="preserve">  small vs cp: too noisy</text>
<text x="12" y="360" fill="#555555" font-weight="normal" xml:space="preserve">  small vs rsync: too noisy</text>
<text x="12" y="380" fill="#555555" font-weight="normal" xml:space="preserve">  mixed vs cp: too noisy</text>
<text x="12" y="400" fill="#555555" font-weight="normal" xml:space="preserve">  mixed vs rsync: too noisy</text>
<text x="12" y="440" fill="#111111" font-weight="bold" xml:space="preserve">Windows - warm cache, Defender off - 49fabc4 2026-10-09</text>
<text x="12" y="460" fill="#555555" font-weight="normal" xml:space="preserve">Not shown:</text>
<text x="12" y="480" fill="#555555" font-weight="normal" xml:space="preserve">  large vs robocopy: too noisy</text>
<text x="12" y="500" fill="#555555" font-weight="normal" xml:space="preserve">  small vs robocopy: too noisy</text>
<text x="12" y="520" fill="#555555" font-weight="normal" xml:space="preserve">  mixed vs robocopy: too noisy</text>
</svg>
