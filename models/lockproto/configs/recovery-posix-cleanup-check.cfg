\* recovery scenario, POSIX, strong identity, strong lock capability: the Recoverer/Cleanup pairing of
\* the check suite (design Section 12). Both actors move a dead owner's lock aside through 240.3, so
\* this is where two movers of different kinds meet. Measured: 1,199,193 distinct states, exhausts.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1}
    Recoverers = {r1}
    PlainRuns = {}
    Cleanups = {c1}
    Breakers = {}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 5
    MaxCrashes = 2
    HostCrashes = FALSE
    MaxLeaseExpiries = 0
    Platform = "posix"
    IdentityStrength = "strong"
    LockCapability = "strong"
    SEED_RECOVER_FOREIGN = FALSE
    SEED_RECOVER_UNCERTAIN = FALSE
    SEED_DEAD_AS_BUSY = FALSE
    SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = FALSE
    SEED_ACQUIRER_UNLINKS_BY_NAME = FALSE
    SEED_RESTART_RELEASES = FALSE
    SEED_MOVE_ASIDE_FOR_UNCERTAIN = FALSE
    SEED_RENAME_OVER_TAKEOVER = FALSE
    SEED_NO_CAPABILITY_GATE = FALSE
    SEED_TORN_AS_FOREIGN = FALSE
    SEED_FS_LOCK_WITHOUT_HANDLE = FALSE
    SEED_FS_ALIEN_CONTENT = FALSE
    FIX_REMOTE_LEASE_SPEC = FALSE
    defaultInitValue = defaultInitValue
