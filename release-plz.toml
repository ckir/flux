# release-plz (https://release-plz.dev), run by .github/workflows/release-plz.yml.
#
# Every push to main refreshes one release pull request: it bumps the shared workspace version, updates
# Cargo.lock and adds the next section of CHANGELOG.md. Merging that pull request is the release: release-plz
# then creates the `v{version}` tag and its GitHub release, and the tag starts .github/workflows/release.yml,
# which builds the binaries and attaches them.

[workspace]
# Nothing is published to crates.io (every crate has `publish = false`): the last released version is read
# from the `v{version}` git tags instead of the registry.
git_only = true
publish = false
# A binary with no published library API has nothing for cargo-semver-checks to compare against.
semver_check = false
# Release only when the release pull request is merged, not on every push to main.
release_always = false
# One tag and one GitHub release for the whole workspace, made by flux-cli below.
git_tag_enable = false
git_release_enable = false
changelog_update = false
pr_labels = ["release"]

# flux-cli ships the `flux` binary, so it carries the tag, the release and the one changelog, which also
# lists the commits of every other package (the root package owns everything outside crates/).
[[package]]
name = "flux-cli"
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"
changelog_update = false
version_group = "flux"

# The root package owns the changelog, because it is the only one release-plz attributes the whole
# repository to. MEASURED: with the changelog on flux-cli it carried ONE entry - `changelog_include`
# merges other packages' GENERATED changelogs, and `[workspace] changelog_update = false` meant the
# six included packages generated nothing. It keeps `v{{ version }}` so its links point at the tag
# flux-cli actually creates.
[[package]]
name = "flux"
version_group = "flux"
changelog_update = true
changelog_path = "CHANGELOG.md"
git_tag_name = "v{{ version }}"

[[package]]
name = "flux-core"
version_group = "flux"

[[package]]
name = "flux-fs"
version_group = "flux"

[[package]]
name = "flux-platform"
version_group = "flux"

[[package]]
name = "flux-hash"
version_group = "flux"

[[package]]
name = "flux-ui"
version_group = "flux"

[changelog]
# Groups for the commit types this repository uses (CONTRIBUTING.md). A commit matching no parser lands in
# "Other" rather than vanishing.
commit_parsers = [
    { message = "^release", skip = true },
    { message = "^wip", skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    # Skipped: this changelog describes the SHIPPED BINARY, and these types do not change it. They are
    # the bulk of the repository - 130 spec, 43 design, 31 model, 11 docs, 8 skills, 8 plan, 5 test at
    # v0.1.0 - so without these skips the notes run to 240 entries and bury the few that ship.
    { message = "^(spec|design|plan)", skip = true },
    { message = "^(model|runner|trace|recovery)", skip = true },
    { message = "^(docs|skills)", skip = true },
    { message = "^tests?", skip = true },
    { message = "^(ci|build)", group = "Build and CI" },
    { message = "^(chore|style|revert)", group = "Miscellaneous" },
    { message = ".*", group = "Other" },
]
