\* recovery scenario, POSIX, host crashes on, ONE Owner and no other actor: witness run for
\* NeverRevertedOwnWrite (cut 6, item 6). Expected VIOLATED: a host crash's "old" pick reverts the Owner's
\* unflushed lock record to EmptyFile. With a second actor another create could make the same state, so the
\* pairing is the point. No SYMMETRY: there is nothing to permute.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1}
    Recoverers = {}
    PlainRuns = {}
    Cleanups = {}
    Breakers = {}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 3
    MaxCrashes = 2
    HostCrashes = TRUE
    MaxLeaseExpiries = 0
    Platform = "posix"
    IdentityStrength = "strong"
    LockCapability = "strong"
    SEED_RECOVER_FOREIGN = FALSE
    SEED_RECOVER_UNCERTAIN = FALSE
    SEED_DEAD_AS_BUSY = FALSE
    SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = FALSE
    SEED_ACQUIRER_UNLINKS_BY_NAME = FALSE
    SEED_RESTART_RELEASES = FALSE
    SEED_MOVE_ASIDE_FOR_UNCERTAIN = FALSE
    SEED_RENAME_OVER_TAKEOVER = FALSE
    SEED_NO_CAPABILITY_GATE = FALSE
    SEED_TORN_AS_FOREIGN = FALSE
    SEED_FS_LOCK_WITHOUT_HANDLE = FALSE
    SEED_FS_ALIEN_CONTENT = FALSE
    SEED_CHECK_REFUSES_UNTOUCHED = FALSE
    SEED_RECOVER_LIVE = FALSE
    SEED_FS_PAST_UNALLOCATED = FALSE
    SEED_FS_DOUBLE_HANDLE = FALSE
    SEED_FS_ENTRY_UNALLOCATED = FALSE
    SEED_FS_ALIEN_RECORD = FALSE
    SEED_RECOVERER_GIVES_UP = FALSE
    SEED_RELEASE_CHECK_REFUSES_UNTOUCHED = FALSE
    SEED_RESTART_CHECK_REFUSES_UNTOUCHED = FALSE
    SEED_TAKEOVER_FOREIGN = FALSE
    HostCrashAtDurableOnly = FALSE
    FIX_REMOTE_LEASE_SPEC = FALSE
    defaultInitValue = defaultInitValue
INVARIANT
    NeverRevertedOwnWrite
