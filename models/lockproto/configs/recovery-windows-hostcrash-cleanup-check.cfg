\* recovery scenario, WINDOWS, host crashes on: the host-crash tier's run of two movers of different kinds
\* (design Section 12). Actors and bounds as recovery-windows-cleanup-check.cfg, with HostCrashes = TRUE.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1}
    Recoverers = {r1}
    PlainRuns = {}
    Cleanups = {c1}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 5
    MaxCrashes = 2
    HostCrashes = TRUE
    Platform = "windows"
    IdentityStrength = "strong"
    LockCapability = "strong"
    defaultInitValue = defaultInitValue
INVARIANTS
    FsOk
    Classifiable
    SingleWriter
    PlainNeverOwnsUncertain
    ForeignUntouched
    RefusalJustified
