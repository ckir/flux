name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege, workflow-wide. `pages: write` + `id-token: write` are granted
# per-job, on `deploy` only — the `build` job runs `cargo doc`, which executes
# dependency build scripts, and that job has no business holding a Pages OIDC
# token. A job-level permissions block overrides this default for that job.
permissions:
  contents: read

# One deployment at a time. Do NOT cancel a run in progress: cancelling a
# half-finished Pages deploy can leave the site in a broken state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build docs
        # -D warnings catches broken intra-doc links, which are otherwise
        # invisible until someone clicks a dead link on the published site.
        # --document-private-items because every crate here is publish = false:
        # the audience is contributors, not downstream API consumers.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Assemble the site
        # Before the bench step, so bench/ is added to the finished root rather than
        # the assembly moving rustdoc around it. Also writes the landing page that
        # `cargo doc` on a workspace never produces (otherwise the root is a 404).
        run: python pages/assemble.py assemble

      - name: Add the benchmark pages
        # The data branch goes into target/doc/bench/ beside the trend page, so one deploy serves the docs and the
        # benchmarks (spec "Where the data lives"). Before the first benchmark, or if the branch was deleted, the docs
        # deploy alone.
        run: |
          if git ls-remote --exit-code --heads origin bench-data > /dev/null; then
            git fetch --depth 1 origin bench-data
            mkdir -p target/doc/bench
            git archive FETCH_HEAD | tar -x -C target/doc/bench
            cp benches/publish/site/index.html target/doc/bench/index.html
          else
            echo "no bench-data branch yet: deploying the docs without bench/"
          fi

      - name: Verify the site
        # After the bench step, so nothing that runs later can break the result
        # unseen: this checks the tree that is about to be uploaded.
        run: python pages/assemble.py verify

      # No actions/configure-pages: its only job is computing base_url for static
      # site generators, which rustdoc does not consume, and `enablement` defaults
      # to false so it never creates the site either. Pages is already enabled with
      # build_type=workflow, so the step is dead weight — and dropping it keeps the
      # build job honestly at contents:read.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
