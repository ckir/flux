\* recovery scenario, POSIX, strong identity, strong lock capability: the liveness run (design
\* Section 12). It declares NO SYMMETRY: symmetry and liveness checking together are unsound in TLC,
\* and TLC does not refuse the combination, so the runner rejects a liveness configuration that
\* carries one. Exactly one PROPERTY, because TLC reports a temporal violation without naming the
\* property it belongs to.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1}
    Recoverers = {r1, r2}
    PlainRuns = {}
    Cleanups = {}
    Breakers = {}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 3
    MaxCrashes = 2
    HostCrashes = FALSE
    MaxLeaseExpiries = 0
    Platform = "posix"
    IdentityStrength = "strong"
    LockCapability = "strong"
    SEED_RECOVER_FOREIGN = FALSE
    SEED_RECOVER_UNCERTAIN = FALSE
    SEED_DEAD_AS_BUSY = FALSE
    SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = FALSE
    SEED_ACQUIRER_UNLINKS_BY_NAME = FALSE
    SEED_RESTART_RELEASES = FALSE
    SEED_MOVE_ASIDE_FOR_UNCERTAIN = FALSE
    SEED_RENAME_OVER_TAKEOVER = FALSE
    SEED_NO_CAPABILITY_GATE = FALSE
    SEED_TORN_AS_FOREIGN = FALSE
    FIX_ACCEPT_CHECK_TO_CALL_WINDOW = FALSE
    defaultInitValue = defaultInitValue
PROPERTY
    DeadLockEventuallyCleared
INVARIANTS
    FsOk
    Classifiable
    SingleWriter
    PlainNeverOwnsUncertain
    ForeignUntouched
    RefusalJustified
