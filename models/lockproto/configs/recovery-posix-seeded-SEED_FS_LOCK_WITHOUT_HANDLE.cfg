\* recovery scenario, POSIX, strong identity, strong lock capability: the Recoverer/Recoverer pairing
\* SEEDED: the environment corrupts `fs` directly - an OS-native lock held by a process with no open handle (LockImpliesHandle). The PROTOCOL cannot do this, so
\* without the seed `FsOk` is true by construction and no run could tell it from TRUE. This run
\* is what proves the harness would catch a bad FsModel edit (test audit, plan 3, TA-1).
SPECIFICATION Spec
CONSTANTS
    Owners = {o1}
    Recoverers = {r1, r2}
    PlainRuns = {}
    Cleanups = {}
    Breakers = {}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 3
    MaxCrashes = 2
    HostCrashes = FALSE
    MaxLeaseExpiries = 0
    Platform = "posix"
    IdentityStrength = "strong"
    LockCapability = "strong"
    SEED_RECOVER_FOREIGN = FALSE
    SEED_RECOVER_UNCERTAIN = FALSE
    SEED_DEAD_AS_BUSY = FALSE
    SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = FALSE
    SEED_ACQUIRER_UNLINKS_BY_NAME = FALSE
    SEED_RESTART_RELEASES = FALSE
    SEED_MOVE_ASIDE_FOR_UNCERTAIN = FALSE
    SEED_RENAME_OVER_TAKEOVER = FALSE
    SEED_NO_CAPABILITY_GATE = FALSE
    SEED_TORN_AS_FOREIGN = FALSE
    SEED_FS_LOCK_WITHOUT_HANDLE = TRUE
    SEED_FS_ALIEN_CONTENT = FALSE
    SEED_CHECK_REFUSES_UNTOUCHED = FALSE
    FIX_REMOTE_LEASE_SPEC = FALSE
    defaultInitValue = defaultInitValue
INVARIANTS
    FsOk
    Classifiable
    SingleWriter
    PlainNeverOwnsUncertain
    ForeignUntouched
    RefusalJustified
