# Traceability map of the lock-protocol model (design Section 9.1).
#
# One [[unit]] per unit of each heading listed in spec-sections.stamp:
#
#   [[unit]]
#   heading = "## 240.5 `--break-lock`"   # the heading line exactly as in the spec
#   ordinal = 2                            # the unit's position in that heading's own text
#   quote = "Open the existing lock file"  # a sentence of the unit
#   hash = "<BLAKE3 hex>"                  # written by `just model-stamp`
#   labels = ["S240_5_s2"]                 # PlusCal labels that implement it, and/or
#   # not_modelled = "<reason>"            # instead of, or alongside, labels (together they mean
#                                           # a partly modelled unit), and/or
#   # pending = ["<scenario>", ...]        # scenarios not yet built that still owe this unit
#                                           # labels; may accompany labels. At least one of
#                                           # labels, not_modelled, or pending is required.
#
# `[[heading]]` entries cover every heading in a stamped heading's family (Section 9) other than
# a stamped one itself:
#
#   [[heading]]
#   heading = "## 96.3 A New Sibling"  # the heading line exactly as in the spec
#   family = "96"                      # the number whose family it is in (M for a stamped M.N)
#   count = 1                          # how many times that line occurs in that family
#   not_modelled = "<reason>"          # exactly one of this or `pending` below
#   # pending = ["<scenario>", ...]    # scenarios that will cover it; never both with not_modelled
#
# A `[[heading]]` entry never carries labels: a heading whose text the model encodes is stamped,
# never listed here.
#
# `planned_scenarios` lists, at the top level, every scenario not yet built that some `pending`
# array still owes labels to. Each name in a `pending` array must be in `planned_scenarios`, and a
# scenario must not be in both `planned_scenarios` and expected.toml's `scenarios` list: building a
# scenario moves its name out of `planned_scenarios` (Section 9.1).
#
# Headings enter the stamp as the model encodes them (plan 2 onward).

planned_scenarios = ["breaklock", "mixed", "cleanup", "cleanup-crash", "nested", "dirlock", "claims"]
