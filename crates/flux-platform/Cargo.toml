[package]
name = "flux-platform"
description = "Linux, macOS and Windows implementations of the Flux filesystem abstractions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
flux-fs = { path = "../flux-fs" }

# `accessat` for the write-protection guard in `std_fs.rs`. Unix only: Windows has no
# equivalent that is worth the cost, and its own `rename` already refuses a read-only
# destination, so the attribute check suffices there.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

# `FILE_ID_INFO` for object identity in `std_fs.rs`. The 64-bit file index std exposes
# is not unique on ReFS (§107, §109.1), so identity needs the 128-bit id, which is only
# reachable through a handle.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

# The filesystem probes of the lock-protocol model (tests/fs_semantics.rs,
# lock-model design Section 10).
[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true }
