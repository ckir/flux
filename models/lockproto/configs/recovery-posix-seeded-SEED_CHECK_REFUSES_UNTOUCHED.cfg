\* recovery scenario, POSIX, strong identity, strong lock capability: the Recoverer/Recoverer pairing
\* SEEDED: every Section 99 check fails, so a holder nobody dispossessed refuses TARGET_LOCK_BUSY with its
\* `lostLock` ghost still FALSE. That is RefusalJustified's `lostLock` half - S99_check, S99_release_check
\* and S21_1_s3 - which no run could tell from TRUE, because a check fails only after something marked the
\* holder (test audit, plan 3, TB-1). This run is what proves a mutant hardwiring `refusedOk` would be caught.
SPECIFICATION Spec
