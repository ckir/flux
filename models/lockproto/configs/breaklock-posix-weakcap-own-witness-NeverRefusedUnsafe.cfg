\* breaklock scenario, POSIX, LockCapability = weak, the capability gate NOT bypassed, and exactly ONE
\* actor: an owning operation (96.1). Each of the five 235.1 refusal sites belongs to a different process kind, and a
\* witness halts at the FIRST violating state - so one run per kind is the only way each site is really
\* reached. This one is `own_start` (capstone, plan 3, round 6: round 5 left two kinds sharing one run,
\* so one of them was still reached by nothing).
SPECIFICATION Spec
