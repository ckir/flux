# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Flux ships on Linux, macOS and Windows (spec header) — audit all of them.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-pc-windows-msvc" },
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8
# Flux's own crates are PolyForm-Noncommercial-1.0.0 and publish = false. Exempt them
# here rather than adding PolyForm to `allow` — that would also silently permit a
# noncommercial *dependency*, which we must never ship.
private = { ignore = true }
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
allow = []
deny = [
    # Flux does no networking and must stay dependency-light; a TLS stack
    # appearing in the graph means something pulled in more than we intended.
    { name = "openssl-sys", reason = "Flux does no networking; prefer rustls if TLS is ever needed" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
