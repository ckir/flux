\* recovery scenario, POSIX: seeded run for SEED_RECOVER_UNCERTAIN (design Section 8): a Recoverer moves aside a lock it judged uncertain, which 240.4 preserves.
\* The actors and bounds are those of recovery-posix-check.cfg; the run must stop with PlainNeverOwnsUncertain violated. It lists every
\* safety invariant of the scenario, so a seed that breaks a different one first fails the run.
SPECIFICATION Spec
SYMMETRY RecovererPerms
CONSTANTS
    Owners = {o1}
    Recoverers = {r1, r2}
    PlainRuns = {}
    Cleanups = {}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 3
    MaxCrashes = 2
    HostCrashes = FALSE
    Platform = "posix"
    IdentityStrength = "strong"
    LockCapability = "strong"
    SEED_RECOVER_FOREIGN = FALSE
    SEED_RECOVER_UNCERTAIN = TRUE
    SEED_DEAD_AS_BUSY = FALSE
    defaultInitValue = defaultInitValue
INVARIANTS
    FsOk
    Classifiable
    SingleWriter
    PlainNeverOwnsUncertain
    ForeignUntouched
    RefusalJustified
