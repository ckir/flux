[[mutant]]
name = "t5-flip-hostcrash-compare"
file = "algorithm.txt"
old = "hostCrashChangedLock := (hostCrashChangedLock \\/ At(FsHostCrash(LandUnlink(fs, lander, c), pick, dirs), P, LockName) # At(LandUnlink(fs, lander, c), P, LockName));"
new = "hostCrashChangedLock := (hostCrashChangedLock \\/ At(FsHostCrash(LandUnlink(fs, lander, c), pick, dirs), P, LockName) = At(LandUnlink(fs, lander, c), P, LockName));"
config = "configs/recovery-posix-hostcrash-control-check.cfg"
expect_present = "NeverHostCrashChangedLock"

