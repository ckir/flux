\* recovery scenario, POSIX: seeded run for SEED_RECOVER_FOREIGN (design Section 8): a Recoverer judges the Foreign object at the lock path replaceable and moves it aside through 240.3.
\* The actors and bounds are those of recovery-posix-check.cfg; the run must stop with ForeignUntouched violated. It lists every
\* safety invariant of the scenario, so a seed that breaks a different one first fails the run.
SPECIFICATION Spec
SYMMETRY RecovererPerms
CONSTANTS
    Owners = {o1}
    Recoverers = {r1, r2}
    PlainRuns = {}
    Cleanups = {}
    Breakers = {}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    MaxObjs = 3
    MaxCrashes = 2
    HostCrashes = FALSE
    MaxLeaseExpiries = 0
    Platform = "posix"
    IdentityStrength = "strong"
    LockCapability = "strong"
    SEED_RECOVER_FOREIGN = TRUE
    SEED_RECOVER_UNCERTAIN = FALSE
    SEED_DEAD_AS_BUSY = FALSE
    SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = FALSE
    SEED_ACQUIRER_UNLINKS_BY_NAME = FALSE
    SEED_RESTART_RELEASES = FALSE
    SEED_MOVE_ASIDE_FOR_UNCERTAIN = FALSE
    SEED_RENAME_OVER_TAKEOVER = FALSE
    SEED_NO_CAPABILITY_GATE = FALSE
    SEED_TORN_AS_FOREIGN = FALSE
    FIX_ACCEPT_CHECK_TO_CALL_WINDOW = FALSE
    defaultInitValue = defaultInitValue
INVARIANTS
    FsOk
    Classifiable
    SingleWriter
    PlainNeverOwnsUncertain
    ForeignUntouched
    RefusalJustified
